    transform/default_self_metrics:
        error_mode: ignore
        log_statements:
            - context: resource
              statements:
                - set(attributes["gcp.project_id"], attributes["cloud.account.id"]) where attributes["gcp.project_id"] == nil and attributes["cloud.account.id"] != nil
        metric_statements:
            - context: resource
              statements:
                - set(attributes["gcp.project_id"], attributes["cloud.account.id"]) where attributes["gcp.project_id"] == nil and attributes["cloud.account.id"] != nil
receivers:
    otlp/default_self_metrics:
        protocols:
            grpc:
                endpoint: localhost:18888
                keepalive:
                    enforcement_policy: {}
                    server_parameters: {}
                read_buffer_size: 524288
                transport: tcp
service:
    extensions:
        - googleclientauth/default_gcp_destination
    pipelines:
        logs/default_self_metrics:
            exporters:
                - otlp_grpc/default_gcp_destination
            processors:
                - resourcedetection/default_self_metrics
                - transform/default_self_metrics
                - queuebatch/default_gcp_destination_batch_logs
            receivers:
                - otlp/default_self_metrics
        metrics/default_self_metrics:
            exporters:
                - otlp_grpc/default_gcp_destination
            processors:
                - resourcedetection/default_self_metrics
                - transform/default_self_metrics
                - queuebatch/default_gcp_destination_batch_metrics
            receivers:
                - otlp/default_self_metrics
    telemetry:
        logs:
            encoding: console
            error_output_paths:
                - stderr
            level: info
            output_paths:
                - stderr
            processors:
                - batch:
                    exporter:
                        otlp:
                            endpoint: http://localhost:18888
                            insecure: true
                            protocol: grpc
            sampling:
                enabled: true
                initial: 10
                thereafter: 100
                tick: 10s
        metrics:
            level: Normal
            readers:
                - periodic:
                    exporter:
                        otlp:
                            endpoint: http://localhost:18888
                            insecure: true
                            protocol: grpc
                    interval: 5000
                    timeout: 30000
        resource:
            attributes:
                - name: service.instance.id
                  value: 76728b45-8fcf-4cc8-a09e-c67283bfa79c
                - name: gcp.fleet_id
                  value: "1234"
