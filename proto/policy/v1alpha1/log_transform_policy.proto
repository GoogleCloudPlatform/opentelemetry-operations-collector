syntax = "proto3";

package google.telemetry.policy.v1alpha1;

import "policy/v1alpha1/common_policy_types.proto";
import "policy/v1alpha1/log_filter_policy.proto";

option go_package = "github.com/GoogleCloudPlatform/opentelemetry-operations-collector/gen/go/policy/v1alpha1;policyv1alpha1";

// LogTransformPolicy defines a single conditional in-memory modification to
// matching log records.
//
// Evaluation & Ordering Semantics:
// - Operation Stage Order: Active LogTransformPolicy instances execute in the
//   order of their operation type: `rename` -> `add` -> `remove` -> `redact`.
// - Tie-Breaking: Within the same operation type, policies execute in
//   lexicographical order of `id`.
// - Matching: All conditions in `matches` are ANDed together; at least one
//   matcher is required.
// - Fail-Open: If `action` is unset, or if an action cannot be applied to a
//   record (e.g., `rename` when `from` does not exist, or `add`/`rename` with
//   `upsert: false` when the target field already exists), the record passes
//   through unmodified.
message LogTransformPolicy {
  // Unique identifier for the policy within its configuration scope
  // (e.g. a UUID or namespaced URI like "projects/p/locations/l/policySets/ps/policies/label-soc-logs").
  string id = 1;

  // Conditions evaluated against incoming log records.
  // All matchers in this list are ANDed together: all conditions must evaluate
  // to true for the transformation action to take effect.
  // At least one matcher is required; a policy with no matchers is invalid.
  repeated LogMatcher matches = 2;

  // The single transformation action to perform when `matches` evaluates to
  // true. Exactly one action must be set.
  oneof action {
    // Inserts or overwrites a field or attribute.
    LogAddAction add = 3;

    // Deletes a field or attribute.
    LogRemoveAction remove = 4;

    // Moves an existing field or attribute to a new destination key.
    LogRenameAction rename = 5;

    // Masks sensitive substrings within a target string.
    LogRedactAction redact = 6;
  }
}

// LogAddAction inserts or overwrites one field or attribute on a log record.
message LogAddAction {
  // Target field or attribute to set.
  LogFieldSelector target = 1;

  // The typed scalar value to set (supporting string, int64, bool, double, bytes).
  Value value = 2;

  // If true, overwrites `target` if it already exists. If false (default),
  // preserves the existing value when `target` is already present.
  bool upsert = 3;
}

// LogRemoveAction deletes a field or attribute from a log record.
message LogRemoveAction {
  // Target field or attribute to remove.
  LogFieldSelector target = 1;
}

// LogRenameAction moves an existing field or attribute to a new destination key.
message LogRenameAction {
  // Existing source field or attribute to rename.
  // (-- api-linter: core::0140::reserved-words=disabled
  //     api-linter: core::0140::prepositions=disabled --)
  LogFieldSelector from = 1;

  // Destination field or attribute.
  // (-- api-linter: core::0140::prepositions=disabled --)
  LogFieldSelector to = 2;

  // If true, overwrites `to` if it already exists. If false (default), the
  // rename is skipped if `to` already exists.
  bool upsert = 3;
}

// LogRedactAction masks sensitive substrings within a target string.
message LogRedactAction {
  // Target string field or attribute to redact.
  LogFieldSelector target = 1;

  // RE2 regular expression matching substrings within the target string
  // to redact. If unset or empty, the entire target value is replaced.
  string regex = 2;

  // String replacement to insert in place of the matched substring.
  // Defaults to "[REDACTED]" if empty.
  string replacement = 3;
}
