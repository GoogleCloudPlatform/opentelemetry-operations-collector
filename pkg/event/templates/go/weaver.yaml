default_comment_format: go
comment_formats:
  go:
    format: markdown
    prefix: "// "
text_maps:
  go_types:
    int: int64
    double: float64
    boolean: bool
    string: string
    int[]: "[]int64"
    double[]: "[]float64"
    boolean[]: "[]bool"
    string[]: "[]string"
  zap_field_constructors:
    int: zap.Int64
    double: zap.Float64
    boolean: zap.Bool
    string: zap.String
    int[]: zap.Int64s
    double[]: zap.Float64s
    boolean[]: zap.Bools
    string[]: zap.Strings
  zap_levels:
    debug: zapcore.DebugLevel
    info: zapcore.InfoLevel
    warn: zapcore.WarnLevel
    error: zapcore.ErrorLevel
templates:
  - template: "events.go.j2"
    filter: .registry
    application_mode: single
    file_name: "generated_events.go"
