file_format: definition/2

metrics:
  # The gauge deliberately declares no unit. It reports state, not a
  # quantity, and the OTLP to Prometheus translation turns the dimensionless
  # unit "1" into a _ratio name suffix, which would render this as
  # gcp_policy_set_active_ratio.
  - name: gcp.policy.set.active
    instrument: gauge
    unit: ""
    stability: development
    requirement_level: recommended
    brief: Whether a control plane policy set is currently active, labeled with its identity.
    note: |
      Exactly one series is reported per collector. The value is 1 while a
      policy set with at least one policy is active, and 0 otherwise, in which
      case both attributes are empty.
    annotations:
      code_generation:
        metric_value_type: int
    attributes:
      - ref: gcp.policy.set.id
        requirement_level: required
      - ref: gcp.policy.set.revision.id
        requirement_level: required
