syntax = "proto3";

package google.telemetry.xds.v1alpha1;

import "envoy/service/discovery/v3/discovery.proto";

option go_package = "github.com/GoogleCloudPlatform/opentelemetry-operations-collector/gen/go/xds/v1alpha1;xdsv1alpha1";

// TelemetryDiscoveryService provides the xDS discovery contract for
// TelemetryCollector resources.
//
// While production clients and Traffic Director multiplex discovery using
// `envoy.service.discovery.v3.AggregatedDiscoveryService` (ADS), defining this
// service establishes the canonical xDS resource contract and enables point-to-point
// streaming for testing and specialized proxies.
service TelemetryDiscoveryService {
  // Bidirectional streaming discovery for TelemetryCollector resources.
  rpc StreamTelemetryCollectors(stream envoy.service.discovery.v3.DiscoveryRequest) returns (stream envoy.service.discovery.v3.DiscoveryResponse);

  // Incremental (delta) streaming discovery for TelemetryCollector resources.
  rpc DeltaTelemetryCollectors(stream envoy.service.discovery.v3.DeltaDiscoveryRequest) returns (stream envoy.service.discovery.v3.DeltaDiscoveryResponse);

  // Unary fetch for TelemetryCollector resources (polling / diagnostics).
  rpc FetchTelemetryCollectors(envoy.service.discovery.v3.DiscoveryRequest) returns (envoy.service.discovery.v3.DiscoveryResponse);
}
