receivers:
  # Ingress OTLP receiver protected by Mutual TLS (mTLS) authentication
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
        tls:
          cert_file: {{.CertDir}}/server.crt
          key_file: {{.CertDir}}/server.key
          client_ca_file: {{.CertDir}}/ca.crt
      http:
        endpoint: 0.0.0.0:4318
        tls:
          cert_file: {{.CertDir}}/server.crt
          key_file: {{.CertDir}}/server.key
          client_ca_file: {{.CertDir}}/ca.crt

  # Dedicated internal loopback receiver for Gateway self-observability telemetry
  otlp/self:
    protocols:
      http:
        endpoint: localhost:4320

processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20
  batch:
    send_batch_size: 100
    timeout: 2s

  # Forwarded Telemetry Processor:
  # resourcedetection with override: false ensures that upstream machine/pod resources are preserved.
  resourcedetection/upstream:
    detectors: [gcp]
    override: false

  # Tag forwarded telemetry with the test run ID and mTLS verified marker
  transform/upstream:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["otelcol_google_e2e"], "{{.TestRunID}}")
          - set(attributes["telemetry_source"], "forwarded_upstream")
          - set(attributes["auth_mode"], "mtls_verified")
    log_statements:
      - context: log
        statements:
          - set(attributes["otelcol_google_e2e"], "{{.TestRunID}}")
          - set(attributes["telemetry_source"], "forwarded_upstream")
          - set(attributes["auth_mode"], "mtls_verified")
    trace_statements:
      - context: span
        statements:
          - set(attributes["otelcol_google_e2e"], "{{.TestRunID}}")
          - set(attributes["telemetry_source"], "forwarded_upstream")
          - set(attributes["auth_mode"], "mtls_verified")

  # Gateway Self-Observability Processor:
  # resourcedetection with override: true enforces the Gateway VM's own gce_instance metadata.
  resourcedetection/self:
    detectors: [gcp]
    override: true

  transform/self:
    error_mode: ignore
    metric_statements:
      - context: datapoint
        statements:
          - set(attributes["otelcol_google_e2e"], "{{.TestRunID}}")
          - set(attributes["telemetry_source"], "gateway_self")
    log_statements:
      - context: log
        statements:
          - set(attributes["otelcol_google_e2e"], "{{.TestRunID}}")
          - set(attributes["telemetry_source"], "gateway_self")

exporters:
  googlecloud:
    log:
      default_log_name: "google-otelcol-gateway-test"

service:
  pipelines:
    # 1. Authenticated Forwarded Upstream Pipelines
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/upstream, transform/upstream, batch]
      exporters: [googlecloud]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/upstream, transform/upstream, batch]
      exporters: [googlecloud]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resourcedetection/upstream, transform/upstream, batch]
      exporters: [googlecloud]

    # 2. Gateway Self-Observability Pipelines
    metrics/self:
      receivers: [otlp/self]
      processors: [memory_limiter, resourcedetection/self, transform/self, batch]
      exporters: [googlecloud]
    logs/self:
      receivers: [otlp/self]
      processors: [memory_limiter, resourcedetection/self, transform/self, batch]
      exporters: [googlecloud]

  telemetry:
    metrics:
      readers:
        - periodic:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4320
    logs:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: http/protobuf
                endpoint: http://localhost:4320
