exporters:
    otlp_grpc/default_gcp_destination:
        auth:
            authenticator: googleclientauth/default_gcp_destination
        balancer_name: round_robin
        compression: gzip
        endpoint: telemetry.googleapis.com:443
        retry_on_failure:
            enabled: true
            initial_interval: 5s
            max_elapsed_time: 5m0s
            max_interval: 30s
            multiplier: 1.5
            randomization_factor: 0.5
        sending_queue:
            enabled: false
        timeout: 5s
        write_buffer_size: 524288
extensions:
    googleclientauth/default_gcp_destination:
        project: ""
        quota_project: ""
        scopes:
            - https://www.googleapis.com/auth/cloud-platform
            - https://www.googleapis.com/auth/logging.write
            - https://www.googleapis.com/auth/monitoring.write
            - https://www.googleapis.com/auth/trace.append
        token_header: authorization
        token_type: access_token
processors:
    queuebatch/default_gcp_destination_batch_logs:
        batch:
            flush_timeout: 200ms
            max_size: 8192
            min_size: 8192
            partition: {}
            sizer: {}
        block_on_overflow: true
        num_consumers: 1
        queue_size: 10
        sizer: {}
        wait_for_result: false
    queuebatch/default_gcp_destination_batch_metrics:
        batch:
            flush_timeout: 200ms
            max_size: 200
            min_size: 200
            partition: {}
            sizer: {}
        block_on_overflow: true
        num_consumers: 1
        queue_size: 10
        sizer: {}
        wait_for_result: false
    queuebatch/default_gcp_destination_batch_traces:
        batch:
            flush_timeout: 200ms
            max_size: 25000
            min_size: 25000
            partition: {}
            sizer: {}
        block_on_overflow: true
        num_consumers: 1
        queue_size: 10
        sizer: {}
        wait_for_result: false
    resourcedetection/default_self_metrics:
        detectors:
            - gcp
        override: false
        timeout: 10s
    transform/default_self_metrics:
        error_mode: ignore
        log_statements:
            - context: resource
              statements:
                - set(attributes["gcp.project_id"], attributes["cloud.account.id"]) where attributes["gcp.project_id"] == nil and attributes["cloud.account.id"] != nil
        metric_statements:
            - context: resource
              statements:
                - set(attributes["gcp.project_id"], attributes["cloud.account.id"]) where attributes["gcp.project_id"] == nil and attributes["cloud.account.id"] != nil
receivers:
    otlp/default_self_metrics:
        protocols:
            grpc:
                endpoint: localhost:18888
                keepalive:
                    enforcement_policy: {}
                    server_parameters: {}
                read_buffer_size: 524288
                transport: tcp
service:
    extensions:
        - googleclientauth/default_gcp_destination
    pipelines:
        logs/default_self_metrics:
            exporters:
                - otlp_grpc/default_gcp_destination
            processors:
                - resourcedetection/default_self_metrics
                - transform/default_self_metrics
                - queuebatch/default_gcp_destination_batch_logs
            receivers:
                - otlp/default_self_metrics
        metrics/default_self_metrics:
            exporters:
                - otlp_grpc/default_gcp_destination
            processors:
                - resourcedetection/default_self_metrics
                - transform/default_self_metrics
                - queuebatch/default_gcp_destination_batch_metrics
            receivers:
                - otlp/default_self_metrics
    telemetry:
        logs:
            encoding: console
            error_output_paths:
                - stderr
            level: info
            output_paths:
                - stderr
            processors:
                - batch:
                    exporter:
                        otlp:
                            endpoint: http://localhost:18888
                            insecure: true
                            protocol: grpc
            sampling:
                enabled: true
                initial: 10
                thereafter: 100
                tick: 10s
        metrics:
            level: Normal
            readers:
                - periodic:
                    exporter:
                        otlp:
                            endpoint: http://localhost:18888
                            insecure: true
                            protocol: grpc
                    interval: 5000
                    timeout: 30000
        resource:
            attributes:
                - name: service.instance.id
                  value: 76728b45-8fcf-4cc8-a09e-c67283bfa79c
                - name: gcp.fleet_id
                  value: "1234"
