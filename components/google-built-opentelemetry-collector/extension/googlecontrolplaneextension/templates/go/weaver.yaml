default_comment_format: go
comment_formats:
  go:
    format: markdown
    prefix: "// "
text_maps:
  go_value_types:
    int: Int64
    double: Float64
  go_attr_types:
    int: int64
    double: float64
    boolean: bool
    string: string
  otel_attr_constructors:
    int: attribute.Int64
    double: attribute.Float64
    boolean: attribute.Bool
    string: attribute.String
templates:
  - template: "metrics.go.j2"
    filter: "{schema_url: .schema_url, metrics: .registry.metrics}"
    application_mode: single
    file_name: "generated_metrics.go"
