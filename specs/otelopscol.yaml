name: otelopscol
description: "OpenTelemetry Collector binary used by the Ops Agent"
module: github.com/GoogleCloudPlatform/opentelemetry-operations-collector/otelopscol
version: v0.162.1
opentelemetry_version: 0.162.0
opentelemetry_contrib_version: 0.162.0
binary_name: otelopscol
build_container: debian
collector_cgo: true
go_version: 1.26.10
build_tags: gpu,remove_all_sd,enable_gce_sd,enable_kubernetes_sd

components:
  receivers:
    - activedirectoryds
    - aerospike
    - apache
    - couchdb
    - elasticsearch
    - filelog
    - flinkmetrics
    - fluentforward
    - hostmetrics
    - iis
    - jmx
    - memcached
    - mysql
    - nginx
    - postgresql
    - prometheus
    - otlp
    - rabbitmq
    - redis
    - saphana
    - sqlquery
    - sqlserver
    - syslog
    - tcplog
    - windowseventlog
    - windowsperfcounters
    # Within this repo
    - zookeeper
    - dcgm
    - mongodb
    - nvml
    - varnish
    - journald
    - otlpjsonfile
  processors:
    - cumulativetodelta
    - deltatocumulative
    - deltatorate
    - filter
    - groupbyattrs
    - interval
    - logstransform
    - metricstransform
    - resourcedetection
    - resource
    - transform
    - batch
    - memorylimiter
    - metricstarttime
    # Within this repo
    - agentmetrics
    - casttosum
    - normalizesums
  exporters:
    - file
    - googlecloud
    - googlemanagedprometheus
    - debug
    - otlp
    - otlphttp
    - prometheus
  extensions:
    - zpages
    - googleclientauth
    - pprof
    - filestorage
  providers:
    - googlesecretmanager
    - file
    - env

replaces:
  - from: github.com/GoogleCloudPlatform/opentelemetry-operations-collector
    to: ../../
    reason: Reference root module of repository to find dependency packages.
  - from: github.com/buger/jsonparser
    to: github.com/buger/jsonparser v1.1.2
    reason: Force update buger/jsonparser to v1.1.2 to fix vulnerability
  - from: github.com/GoogleCloudPlatform/opentelemetry-operations-go/exporter/collector
    to: github.com/GoogleCloudPlatform/opentelemetry-operations-go/exporter/collector v0.63.0
    reason: Test opentelemetry-operations-go release v1.39.0/v0.63.0 for retry_on_failure.
  - from: github.com/GoogleCloudPlatform/opentelemetry-operations-go/exporter/trace
    to: github.com/GoogleCloudPlatform/opentelemetry-operations-go/exporter/trace v1.39.0
    reason: Test opentelemetry-operations-go release v1.39.0/v0.63.0 for retry_on_failure.
  - from: github.com/open-telemetry/opentelemetry-collector-contrib/exporter/googlecloudexporter
    to: github.com/franciscovalentecastro/opentelemetry-collector-contrib/exporter/googlecloudexporter 2ccbf0f93a956ff839624843782aedb9e73b6a6e
    reason: Test contrib PR #52568 for googlecloudexporter retry_on_failure.
