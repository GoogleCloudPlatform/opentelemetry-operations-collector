syntax = "proto3";

package google.telemetry.policy.v1alpha1;

option go_package = "github.com/GoogleCloudPlatform/opentelemetry-operations-collector/gen/go/policy/v1alpha1;policyv1alpha1";

// Enables file tailing (`filelog` receiver) with upstream single-line
// defaults.
//
// Evaluation, Deduplication & Security Guardrails:
// - At least one non-empty, non-whitespace `included_paths` pattern with valid
//   glob syntax is required; invalid patterns are rejected (fail-open).
// - Duplicate `included_paths` patterns within a single policy are
//   deduplicated preserving first-seen order (Windows drive-letter paths are
//   compared after normalizing `\` to `/` and lowercasing the path).
// - Host filesystem access boundaries are enforced by the collector's
//   install-time OS and container sandbox (for example, Linux systemd mount
//   namespace directives and non-root service user permissions, Windows
//   service SID ACLs, or container volume mounts) rather than a hardcoded
//   in-daemon OS log root allowlist.
// - Multiple FileLogSourcePolicy instances merge into a single shared `filelog`
//   receiver via the set union of `included_paths` patterns (avoiding duplicate
//   reads when globs overlap and preserving `file_storage` bookmarks across
//   policy ID renames).
// - Built-in Guardrails: Automatically sets `include_file_path: true` (so
//   `LogFilterPolicy` can match on `log.file.path` / `log.file.name`) and
//   excludes compressed binary archives (`**/*.gz`, `**/*.bz2`, `**/*.xz`,
//   `**/*.zst`, `**/*.zip`).
message FileLogSourcePolicy {
  // Unique identifier for the policy within its configuration scope.
  string id = 1;

  // File path glob patterns to tail.
  //
  // Supported glob syntax:
  // - `*` matches zero or more non-separator characters.
  // - `**` matches zero or more directories or path segments recursively across
  //   path separators when used as a complete path segment.
  // - `?` matches any single non-separator character.
  //
  // At least one pattern is required, and each pattern must be a non-empty,
  // non-whitespace string without `[...]` character classes, `{a,b}` brace
  // alternation, or `\` glob escapes (except in Windows drive-letter paths such
  // as `C:\...`, where `\` is treated as a path separator and normalized to
  // `/`).
  repeated string included_paths = 2;
}
