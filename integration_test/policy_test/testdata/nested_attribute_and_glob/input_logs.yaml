resourceLogs:
  - resource:
      attributes:
        - key: service.name
          value:
            stringValue: api-gateway
    scopeLogs:
      - scope:
          name: http.middleware
        logRecords:
          - timeUnixNano: "1700000000000000000"
            severityNumber: 9
            severityText: INFO
            body:
              stringValue: PUBLIC_TOKEN_REQUEST
            attributes:
              - key: http
                value:
                  kvlistValue:
                    values:
                      - key: headers
                        value:
                          kvlistValue:
                            values:
                              - key: authorization
                                value:
                                  stringValue: Bearer public-token-123
          - timeUnixNano: "1700000001000000000"
            severityNumber: 9
            severityText: INFO
            body:
              stringValue: SECRET_TOKEN_REQUEST
            attributes:
              - key: http
                value:
                  kvlistValue:
                    values:
                      - key: headers
                        value:
                          kvlistValue:
                            values:
                              - key: authorization
                                value:
                                  stringValue: Bearer secret-admin-xyz
